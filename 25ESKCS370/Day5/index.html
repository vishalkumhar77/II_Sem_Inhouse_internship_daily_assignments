<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>University Student Portal</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-navy shadow-sm">
  <div class="container">
    <span class="navbar-brand fw-bold">
      <i class="fa fa-graduation-cap"></i> Student Finder
    </span>
  </div>
</nav>

<!-- ================= STATS ================= -->
<div class="container my-4">
  <div class="row g-3">

    <div class="col-md-3">
      <div class="stat-card text-center">
        <h6>Total Students</h6>
        <h3 id="totalStudents">0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card text-center">
        <h6>Active Students</h6>
        <h3 id="activeStudents">0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card text-center">
        <h6>Average CGPA</h6>
        <h3 id="avgCgpa">0</h3>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card text-center">
        <h6>Attendance</h6>
        <h3 id="avgAttendance">0%</h3>
      </div>
    </div>

  </div>
</div>

<!-- ================= SEARCH SECTION ================= -->
<div class="container my-3">

  <div class="row g-2">

    <!-- SEARCH (NAME + ID ONLY) -->
    <div class="col-md-6">
      <input type="text" id="searchBox" class="form-control"
        placeholder="Search by Student Name or ID">
    </div>

    <!-- SEARCH BUTTON -->
    <div class="col-md-2">
      <button id="searchBtn" class="btn btn-info w-100">
        Search
      </button>
    </div>

    <!-- DEPARTMENT FILTER -->
    <div class="col-md-2">
      <select id="departmentFilter" class="form-select">
        <option value="">Department</option>
      </select>
    </div>

    <!-- CGPA FILTER -->
    <div class="col-md-2">
      <select id="cgpaFilter" class="form-select">
        <option value="">CGPA</option>
        <option value="9">9.0+</option>
        <option value="8">8.0+</option>
        <option value="7">7.0+</option>
        <option value="6">6.0+</option>
      </select>
    </div>

  </div>
</div>

<!-- ================= STUDENT LIST ================= -->
<div class="container">
  <div class="row g-3" id="studentContainer"></div>
</div>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="studentModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Student Profile</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalBody"></div>

    </div>
  </div>
</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
