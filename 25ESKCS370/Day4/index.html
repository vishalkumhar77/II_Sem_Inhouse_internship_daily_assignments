<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark/Light Mode & Counter</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            transition: 0.4s;
            background:#f8f9fa;
            color:#212529;
        }

        .dark-mode{
            background:#121212;
            color:white;
        }

        .card{
            max-width:450px;
            margin:auto;
            margin-top:80px;
            border-radius:20px;
            transition:0.4s;
        }

        .dark-mode .card{
            background:#1f1f1f;
            color:white;
            box-shadow:0 0 15px rgba(255,255,255,0.2);
        }

        h1{
            font-weight:bold;
        }

        #count{
            font-size:70px;
            font-weight:bold;
            margin:20px 0;
        }

        .btn{
            margin:5px;
        }

        .mode-btn{
            position:absolute;
            top:20px;
            right:20px;
        }
    </style>
</head>

<body>

<button id="modeBtn" class="btn btn-dark mode-btn">
    🌙 Dark Mode
</button>

<div class="container">

    <div class="card shadow p-4 text-center">

        <h1>Counter App</h1>

        <div id="count">0</div>

        <button id="plus" class="btn btn-success btn-lg">
            ➕ Plus
        </button>

        <button id="minus" class="btn btn-danger btn-lg">
            ➖ Minus
        </button>

        <button id="reset" class="btn btn-warning btn-lg">
            🔄 Reset
        </button>

    </div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

$(document).ready(function(){

    let count = 0;

    // Increase
    $("#plus").click(function(){
        count++;
        $("#count").fadeOut(100,function(){
            $(this).text(count).fadeIn(100);
        });
    });

    // Decrease
    $("#minus").click(function(){
        count--;
        $("#count").fadeOut(100,function(){
            $(this).text(count).fadeIn(100);
        });
    });

    // Reset
    $("#reset").click(function(){
        count = 0;
        $("#count").fadeOut(100,function(){
            $(this).text(count).fadeIn(100);
        });
    });

    // Dark / Light Mode
    $("#modeBtn").click(function(){

        $("body").toggleClass("dark-mode");

        if($("body").hasClass("dark-mode")){
            $(this)
                .removeClass("btn-dark")
                .addClass("btn-light")
                .text("☀️ Light Mode");
        }
        else{
            $(this)
                .removeClass("btn-light")
                .addClass("btn-dark")
                .text("🌙 Dark Mode");
        }

    });

});

</script>

</body>
</html>
